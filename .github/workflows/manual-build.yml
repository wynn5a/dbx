name: Manual Build

# Build release-mode installers on demand from any branch, without creating a
# GitHub release. Installers are uploaded as workflow artifacts (Actions run
# page -> Artifacts). Run it from the Actions tab or:
#   gh workflow run manual-build.yml --ref <branch> -f platforms=macos-arm64
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - macos-x64
          - linux-x64
          - windows-x64

permissions:
  contents: read

concurrency:
  group: manual-build-${{ github.ref }}-${{ inputs.platforms }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.select.outputs.include }}
      major: ${{ steps.select.outputs.major }}
    steps:
      - uses: actions/checkout@v4

      - name: Select platforms
        id: select
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # Runners + targets mirror release.yml (see the comments there,
          # notably the windows-2022 pin for DuckDB's bundled fmt).
          all='[
            {"name":"macos-arm64","platform":"macos-latest","target":"aarch64-apple-darwin"},
            {"name":"macos-x64","platform":"macos-15-intel","target":"x86_64-apple-darwin"},
            {"name":"linux-x64","platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},
            {"name":"windows-x64","platform":"windows-2022","target":"x86_64-pc-windows-msvc"}
          ]'
          if [ "$PLATFORMS" = "all" ]; then
            include=$(echo "$all" | jq -c .)
          else
            include=$(echo "$all" | jq -c --arg n "$PLATFORMS" 'map(select(.name == $n))')
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"
          # Same major-series key release-cache.yml warms on main.
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'
          # Mirrors release.yml's shared-key so branch runs restore the warm
          # release dependency cache from main; never save, to keep one-off
          # branch builds from filling the repo cache budget.
          shared-key: release-v${{ needs.matrix.outputs.major }}-${{ matrix.target }}-${{ hashFiles('Cargo.toml', '.github/workflows/release-cache.yml') }}
          save-if: false

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils

      # Manual builds are unsigned test builds: skip updater artifacts (.sig +
      # latest.json), which would fail without TAURI_SIGNING_PRIVATE_KEY.
      - name: Disable updater artifacts
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(p, "utf8"));
            conf.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(conf, null, 2));
          '

      # beforeBuildCommand (pnpm build) builds the frontend as part of this.
      - name: Build Tauri app (release)
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dbx-${{ matrix.name }}-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
